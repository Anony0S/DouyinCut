[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "douyincut-backend"
version = "0.1.0"
description = "Local media pipeline for clothing livestream editing"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "httpx>=0.28,<1", "keyring>=25,<26", "oss2>=2.19,<3", "streamget>=4.0.10",
  "websocket-client>=1.8,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app._vendor.pyJianYingDraft" = ["LICENSE"]
"app._vendor.pyJianYingDraft.assets" = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
